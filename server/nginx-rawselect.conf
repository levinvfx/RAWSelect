# RAW Select – anonyme Nutzungszählung (Repo: server/nginx-rawselect.conf).
# Nur die zwei PHP-Endpunkte sind erreichbar; alles andere unter /rawselect/ (Backups, Datenbanken,
# Editor-Reste) liefert 404 — nie wieder Quelltext/Geheimnisse als Klartext.
# Kein Access-Log: die Zählung speichert keine IP-Adressen, auch nicht im Webserver-Log.
location ^~ /rawselect/ {
    access_log off;
    root /var/www;
    location = /rawselect/ping.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /rawselect/stats.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    return 404;
}
