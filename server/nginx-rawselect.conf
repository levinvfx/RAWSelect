# RAW Select – Download-Seite und Download-Zähler (Repo: server/nginx-rawselect.conf).
# Allowlist: nur die hier genannten Pfade sind erreichbar; alles andere unter /rawselect/ (Backups,
# Datenbanken, Editor-Reste) liefert 404 — nie wieder Quelltext/Geheimnisse als Klartext.
# Kein Access-Log: Zählung und Seite speichern keine IP-Adressen, auch nicht im Webserver-Log.

location = /rawselect { access_log off; return 301 /rawselect/; }

location ^~ /rawselect/ {
    access_log off;
    root /var/www;

    # Download-Seite
    location = /rawselect/ {
        try_files /rawselect/index.html =404;
    }
    # Rechtliches als eigene Seiten
    location = /rawselect/datenschutz {
        try_files /rawselect/datenschutz.html =404;
    }
    location = /rawselect/impressum {
        try_files /rawselect/impressum.html =404;
    }
    # Englische Fassung (seit 2.2.1): eigene Pfade, gleiche Allowlist-Regel
    location = /rawselect/en {
        return 301 /rawselect/en/;
    }
    location = /rawselect/en/ {
        try_files /rawselect/en/index.html =404;
    }
    location = /rawselect/en/privacy {
        try_files /rawselect/en/privacy.html =404;
    }
    location = /rawselect/en/imprint {
        try_files /rawselect/en/imprint.html =404;
    }
    location ^~ /rawselect/static/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Download-Weiche: /rawselect/download → neuestes signiertes DMG
    location = /rawselect/download {
        rewrite ^ /rawselect/download.php last;
    }
    location = /rawselect/download.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Installations-Zähler ab App 2.2.2: zufällige Nummer + Version per POST (start.php lehnt alles andere ab),
    # keine IP (access_log off oben). start.php selbst ist nur über /rawselect/start erreichbar.
    location = /rawselect/start {
        rewrite ^ /rawselect/start.php last;
    }
    location = /rawselect/start.php {
        internal;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Stillgelegter Ping (antwortet 204, speichert nichts) für App-Versionen bis 2.0 Beta 1
    location = /rawselect/ping.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # Auswertung: nicht mehr hier, sondern im Portfolio-Admin unter Insights (login + 2FA).

    return 404;
}
