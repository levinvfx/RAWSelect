# RAW Select – Download-Seite und anonyme Nutzungszählung (Repo: server/nginx-rawselect.conf).
# Allowlist: nur die hier genannten Pfade sind erreichbar; alles andere unter /rawselect/ (Backups,
# Datenbanken, Editor-Reste) liefert 404 — nie wieder Quelltext/Geheimnisse als Klartext.
# Kein Access-Log: Zählung und Seite speichern keine IP-Adressen, auch nicht im Webserver-Log.

location = /rawselect { return 301 /rawselect/; }

location ^~ /rawselect/ {
    access_log off;
    root /var/www;

    # Download-Seite
    location = /rawselect/ {
        try_files /rawselect/index.html =404;
    }
    location ^~ /rawselect/static/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Download-Weiche: /rawselect/download → neuestes signiertes DMG
    location = /rawselect/download {
        rewrite ^ /rawselect/download.php last;
    }
    location = /rawselect/download.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Nutzungszählung
    location = /rawselect/ping.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /rawselect/stats.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    return 404;
}
